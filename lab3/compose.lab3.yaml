{
  "name": "bank-lab3",
  "services": {
    "auth-db": {
      "image": "postgres:17-alpine",
      "environment": {
        "POSTGRES_DB": "bank_auth",
        "POSTGRES_USER": "bank_auth",
        "POSTGRES_PASSWORD": "lab3_owner_only"
      },
      "ports": [
        "127.0.0.1:56431:5432"
      ],
      "volumes": [
        "auth-data:/var/lib/postgresql/data",
        "./back/migrations/auth/001_initial.sql:/docker-entrypoint-initdb.d/001.sql:ro",
        "./back/migrations/auth/002_demo.sql:/docker-entrypoint-initdb.d/002.sql:ro",
        "./infra/lab3/auth/003_read_fixtures.sql:/docker-entrypoint-initdb.d/003.sql:ro",
        "./infra/lab3/auth/004_reader.sql:/docker-entrypoint-initdb.d/004.sql:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U bank_auth -d bank_auth"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 30
      },
      "restart": "on-failure:5"
    },
    "transaction-db": {
      "image": "postgres:17-alpine",
      "environment": {
        "POSTGRES_DB": "bank_transaction",
        "POSTGRES_USER": "bank_transaction",
        "POSTGRES_PASSWORD": "lab3_owner_only"
      },
      "ports": [
        "127.0.0.1:56432:5432"
      ],
      "volumes": [
        "transaction-data:/var/lib/postgresql/data",
        "./back/migrations/transaction/001_initial.sql:/docker-entrypoint-initdb.d/001.sql:ro",
        "./back/migrations/transaction/002_demo.sql:/docker-entrypoint-initdb.d/002.sql:ro",
        "./infra/lab3/transaction/003_read_fixtures.sql:/docker-entrypoint-initdb.d/003.sql:ro",
        "./infra/lab3/transaction/004_reader.sql:/docker-entrypoint-initdb.d/004.sql:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U bank_transaction -d bank_transaction"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 30
      },
      "restart": "on-failure:5"
    },
    "analysis-db": {
      "image": "postgres:17-alpine",
      "environment": {
        "POSTGRES_DB": "bank_analysis",
        "POSTGRES_USER": "bank_analysis",
        "POSTGRES_PASSWORD": "lab3_owner_only"
      },
      "ports": [
        "127.0.0.1:56433:5432"
      ],
      "volumes": [
        "analysis-data:/var/lib/postgresql/data",
        "./back/migrations/analysis/001_initial.sql:/docker-entrypoint-initdb.d/001.sql:ro",
        "./back/migrations/analysis/002_demo.sql:/docker-entrypoint-initdb.d/002.sql:ro",
        "./infra/lab3/analysis/003_read_fixtures.sql:/docker-entrypoint-initdb.d/003.sql:ro",
        "./infra/lab3/analysis/004_reader.sql:/docker-entrypoint-initdb.d/004.sql:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U bank_analysis -d bank_analysis"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 30
      },
      "restart": "on-failure:5"
    },
    "case-db": {
      "image": "postgres:17-alpine",
      "environment": {
        "POSTGRES_DB": "bank_case",
        "POSTGRES_USER": "bank_case",
        "POSTGRES_PASSWORD": "lab3_owner_only"
      },
      "ports": [
        "127.0.0.1:56434:5432"
      ],
      "volumes": [
        "case-data:/var/lib/postgresql/data",
        "./back/migrations/case/001_initial.sql:/docker-entrypoint-initdb.d/001.sql:ro",
        "./back/migrations/case/002_demo.sql:/docker-entrypoint-initdb.d/002.sql:ro",
        "./infra/lab3/case/003_read_fixtures.sql:/docker-entrypoint-initdb.d/003.sql:ro",
        "./infra/lab3/case/004_reader.sql:/docker-entrypoint-initdb.d/004.sql:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U bank_case -d bank_case"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 30
      },
      "restart": "on-failure:5"
    },
    "gateway": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.lab3"
      },
      "image": "bank-lab3-python:local",
      "command": [
        "uvicorn",
        "back.lab3.graphql.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ],
      "environment": {
        "LAB3_TRANSPORT": "mock",
        "LAB3_DEMO_ACTOR": "43817961-b437-5313-9754-19535c80b1b9",
        "LAB3_AUTH_DSN": "postgresql://bank_auth_reader:lab3_read_only@auth-db:5432/bank_auth",
        "LAB3_TRANSACTION_DSN": "postgresql://bank_transaction_reader:lab3_read_only@transaction-db:5432/bank_transaction",
        "LAB3_ANALYSIS_DSN": "postgresql://bank_analysis_reader:lab3_read_only@analysis-db:5432/bank_analysis",
        "LAB3_CASE_DSN": "postgresql://bank_case_reader:lab3_read_only@case-db:5432/bank_case"
      },
      "ports": [
        "127.0.0.1:18003:8000"
      ],
      "depends_on": {
        "auth-db": {
          "condition": "service_healthy"
        },
        "transaction-db": {
          "condition": "service_healthy"
        },
        "analysis-db": {
          "condition": "service_healthy"
        },
        "case-db": {
          "condition": "service_healthy"
        }
      },
      "restart": "on-failure:5",
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=6)"
        ],
        "interval": "5s",
        "timeout": "8s",
        "retries": 20
      }
    },
    "frontend": {
      "image": "bank-lab3-python:local",
      "command": [
        "streamlit",
        "run",
        "front/lab3_app.py",
        "--server.address",
        "0.0.0.0",
        "--server.port",
        "8501",
        "--browser.gatherUsageStats",
        "false"
      ],
      "environment": {
        "LAB3_GRAPHQL_URL": "http://gateway:8000/graphql"
      },
      "ports": [
        "127.0.0.1:18503:8501"
      ],
      "depends_on": {
        "gateway": {
          "condition": "service_healthy"
        }
      },
      "restart": "on-failure:5",
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=2)"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20
      }
    },
    "pgadmin": {
      "image": "dpage/pgadmin4:9.8",
      "environment": {
        "PGADMIN_DEFAULT_EMAIL": "lab3@example.com",
        "PGADMIN_DEFAULT_PASSWORD": "Lab3-admin-2026!",
        "PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED": "False",
        "PGADMIN_CONFIG_SESSION_COOKIE_NAME": "'pga4_session_lab3'"
      },
      "ports": [
        "127.0.0.1:18083:80"
      ],
      "volumes": [
        "pgadmin-data:/var/lib/pgadmin",
        "./infra/lab3/servers.json:/pgadmin4/servers.json:ro"
      ],
      "restart": "on-failure:5"
    }
  },
  "volumes": {
    "auth-data": {},
    "transaction-data": {},
    "analysis-data": {},
    "case-data": {},
    "pgadmin-data": {}
  }
}
